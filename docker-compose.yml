x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: unless-stopped
  networks:
    - remnawave-network

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: 5

x-env: &env
  env_file: .env

services:
  remnawave-db:
    image: postgres:17.6
    container_name: 'remnawave-db'
    hostname: remnawave-db
    <<: [*common, *logging, *env]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=UTC
    ports:
      - '127.0.0.1:6767:5432'
    volumes:
      - remnawave-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 10s
      retries: 3

  remnawave-redis:
    image: valkey/valkey:8.1-alpine
    container_name: remnawave-redis
    hostname: remnawave-redis
    <<: [*common, *logging]
    command: >
      valkey-server
      --save ""
      --appendonly no
      --maxmemory-policy noeviction
      --loglevel warning
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 3s
      timeout: 10s
      retries: 3

  remnawave:
    image: remnawave/backend:3.4.11
    container_name: 'remnawave'
    hostname: remnawave
    <<: [*common, *logging, *env]
    ports:
      - '127.0.0.1:3000:${APP_PORT:-3000}'
      - '127.0.0.1:3001:${METRICS_PORT:-3001}'
    depends_on:
      remnawave-db:
        condition: service_healthy
      remnawave-redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:${METRICS_PORT:-3001}/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  remnawave-subscription-page:
    profiles: ["subpage"]
    image: remnawave/subscription-page:8.0.1
    container_name: remnawave-subscription-page
    hostname: remnawave-subscription-page
    <<: [*common, *logging]
    environment:
      - REMNAWAVE_PANEL_URL=http://remnawave:3000
      - REMNAWAVE_API_TOKEN=${REMNAWAVE_API_TOKEN}
      - META_TITLE=Subscription page
      - META_DESCRIPTION=Subscription page description
    ports:
      - '127.0.0.1:3010:3010'
    volumes:
      - ./assets/favicon.svg:/opt/app/frontend/assets/favicon.svg
      - ./assets/favicon-16x16.png:/opt/app/frontend/assets/favicon-16x16.png
      - ./assets/favicon-32x32.png:/opt/app/frontend/assets/favicon-32x32.png
      - ./assets/favicon-48x48.png:/opt/app/frontend/assets/favicon-48x48.png
      - ./assets/favicon-64x64.png:/opt/app/frontend/assets/favicon-64x64.png
      - ./assets/favicon-128x128.png:/opt/app/frontend/assets/favicon-128x128.png
      - ./assets/favicon-180x180.png:/opt/app/frontend/assets/favicon-180x180.png
      - ./assets/favicon-192x192.png:/opt/app/frontend/assets/favicon-192x192.png
      - ./assets/favicon-512x512.png:/opt/app/frontend/assets/favicon-512x512.png
    depends_on:
      - remnawave

  remnawave-cloudflared:
    container_name: remnawave-cloudflared
    hostname: remnawave-cloudflared
    image: cloudflare/cloudflared:latest
    <<: [*common, *logging, *env]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
    depends_on:
      - remnawave
    healthcheck:
      test: ['CMD', 'cloudflared', '--version']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    hostname: caddy
    <<: [*common, *logging]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - remnawave

networks:
  remnawave-network:
    name: remnawave-network
    driver: bridge
    external: false

volumes:
  remnawave-db-data:
    name: remnawave-db-data
    driver: local
    external: false
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
